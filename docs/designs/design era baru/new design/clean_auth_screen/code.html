<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LearnInk Login</title>
<!-- Load Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Load Inter Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            'dark-bg': '#0f172a', // Deep dark blue background
            'card-dark': '#1e293b', // Dark gray/charcoal for form side
            'input-bg': '#334155', // Input background
            'primary-purple': '#6366f1', // Primary button color
            'gradient-start': '#1e1b4b', // Left column gradient start
            'gradient-end': '#312e81', // Left column gradient end
            'text-muted': '#94a3b8', // Muted text color
          }
        }
      }
    }
  </script>
<!-- Custom Styles for specific visual effects -->
<style data-purpose="background-effects">body {
    background-color: #050510;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuB2vgamvLecqQ1vIhoP29VdcJeVxDVrXOOE5rjKv1B6L3MGXoPpVpg5aYNsBNxBKHH3OdM1H59TYGlGiyL_I_4NtLZQjIuqvMoDJIGnEC-r7FTAJKgSY3kJ5r65ttJIAFp3dHYg9yciS7RBGvNp5uYF66P3Mi5TBrtx84ayMmnAQ-3e3t0Cwz1JpYkwk1BTA9C_m5XFa4ag1BGHTb1CwvbZVMvmta9dDf73Y_pkyfbnpj5cyntbIS9HQaxik2lEgNaIxr5uk5Nmdeas);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh
    }
/* Subtle glow for the card */
.login-card {
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1)
    }
/* Input styling override for icons */
.input-icon-wrapper {
    position: relative
    }
.input-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translatey(-50%);
    color: #94a3b8;
    pointer-events: none
    }
.input-field {
    padding-left: 2.75rem;
    /* Space for the icon */
    background-color: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: white
    }
.input-field:focus {
    border-color: #6366f1;
    background-color: rgba(255, 255, 255, 0.1)
    }</style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white font-sans p-4 relative overflow-hidden">
<!-- BEGIN: Login Card Container -->
<!-- Main centered modal card -->
<main class="w-full max-w-5xl bg-card-dark rounded-2xl overflow-hidden flex flex-col md:flex-row login-card border border-white/5 z-10" data-purpose="login-modal">
<!-- BEGIN: Left Column (Visuals) -->
<!-- Gradient background with illustration and branding -->
<section class="w-full md:w-1/2 bg-gradient-to-br from-indigo-900 to-slate-900 relative p-12 flex flex-col items-center justify-center text-center overflow-hidden" style="background: linear-gradient(135deg, #2e1065 0%, #0f172a 100%);">
<!-- Decorative background elements (subtle glowing orbs/lines simulation) -->
<div class="absolute top-0 left-0 w-full h-full opacity-30 pointer-events-none">
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
<div class="absolute top-1/3 right-1/4 w-64 h-64 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
</div>
<!-- Main Illustration -->
<div class="relative z-10 mb-8 w-full max-w-xs transform transition hover:scale-105 duration-500">
<!-- Using a placeholder for the code editor illustration as requested -->
<img alt="Code editor illustration" class="w-full h-auto rounded-lg shadow-2xl border border-white/10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuANHKNuJxQA6xyF_Kysqksgg-Lxy8pKX1QgQcpS7EucGyMXI-bHPoTPawdtktge0pVf5JGje5TYtqKOgYjARWmhOfMgO6DaCnL9YtML0fP-wSUTWN2uqA0L6jrgDdMrTK-BjVALbC2u8Crj-yBgzXRaaaTsjiabvbF5jchh2M96j9bmhFwosa4ULFFelpCxxLsgYHCVU0ZIgAit9pjdd_-yu6OWtP1ukK8YtFdOBv8kVORwU_yxR3e-UZkbz-LUekOPv7-xnvvHhYA9" style="width: 100%; max-width: 380px; height: auto; object-fit: contain;"/>
</div>
<!-- Branding -->
<div class="relative z-10 flex flex-col items-center">
<div class="flex items-center gap-3 mb-4">
<!-- Logo HTML -->
<div class="bg-slate-800 flex items-center justify-center w-10 h-10 rounded-lg border border-white/10">
<span class="text-white font-mono font-bold text-lg">&gt;_</span>
</div>
<h2 class="text-2xl font-bold tracking-tight text-white">LearnInk</h2>
</div>
<!-- Tagline -->
<p class="text-slate-300 text-sm max-w-xs leading-relaxed">
          Master tech skills, the lazy way.<br/>
          All courses are free.
        </p>
</div>
</section>
<!-- END: Left Column -->
<!-- BEGIN: Right Column (Form) -->
<!-- Dark gray background containing the login form -->
<section class="w-full md:w-1/2 bg-[#1e2330] p-8 md:p-12 flex flex-col justify-center">
<div class="max-w-md mx-auto w-full">
<!-- Header -->
<h1 class="text-2xl md:text-3xl font-semibold text-white mb-10">Welcome back, ready to build?</h1>
<!-- Login Form -->
<form action="#" class="space-y-5" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-300" for="email">Email address</label>
<div class="input-icon-wrapper">
<!-- Envelope Icon SVG -->
<svg class="h-5 w-5 input-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<input class="input-field w-full border border-slate-700 rounded-lg py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" id="email" name="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-sm font-medium text-slate-300" for="password">Password</label>
<a class="text-sm text-indigo-400 hover:text-indigo-300 transition-colors" href="#">Forgot password?</a>
</div>
<div class="input-icon-wrapper">
<!-- Lock Icon SVG -->
<svg class="h-5 w-5 input-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<input class="input-field w-full border border-slate-700 rounded-lg py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-slate-600 bg-[#2a3142] text-indigo-600 focus:ring-indigo-500 focus:ring-offset-[#1e2330]" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-slate-400" for="remember-me">
              Remember me for 30 days
            </label>
</div>
<!-- Sign In Button -->
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-[#1e2330] transition-colors" style="background: linear-gradient(to right, #6366f1, #8b5cf6);" type="submit">
            Sign in
          </button>
</form>
<!-- Divider -->
<div class="relative mt-8">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-3 bg-[#1e2330] text-slate-500">Or continue with</span>
</div>
</div>
<!-- Social Login Buttons -->
<div class="mt-8 grid grid-cols-2 gap-4">
<!-- GitHub Button -->
<button class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-[#1e2330] transition-colors" type="button">
<!-- Github Icon SVG -->
<svg aria-hidden="true" class="h-5 w-5 text-white" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>
</svg>
<span>GitHub</span>
</button>
<!-- Google Button -->
<button class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-[#1e2330] transition-colors" type="button">
<!-- Google Icon SVG -->
<svg class="h-5 w-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span>Google</span>
</button>
</div>
</div>
</section>
<!-- END: Right Column -->
</main>
<!-- END: Login Card Container -->
<!-- BEGIN: Footer Elements -->
<!-- Bottom text link -->
<div class="mt-8 text-center text-sm text-slate-400 z-10">
    Don't have an account? <a class="font-medium text-indigo-400 hover:text-indigo-300" href="#">Create one for free</a>
</div>
<!-- Theme Toggle Floating Action Button -->
<button aria-label="Toggle dark mode" class="fixed bottom-6 right-6 p-3 rounded-full bg-[#1e293b] text-slate-400 hover:text-white hover:bg-slate-700 border border-slate-700 shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- END: Footer Elements -->
</body></html>
