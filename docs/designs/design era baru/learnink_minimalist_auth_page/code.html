<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LearnInk Login</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0079a8",
                        "primary-hover": "#006288",
                        "background-light": "#ffffff",
                        "background-dark": "#22262a",
                        "surface-light": "#f8fafc",
                        "border-light": "#e2e8f0",
                        "text-main": "#0f172a",
                        "text-muted": "#64748b",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "body": ["Manrope", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "full": "9999px",
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-main antialiased h-screen flex flex-col md:flex-row overflow-hidden">
<!-- Left Side: Abstract Illustration -->
<div class="hidden md:flex w-1/2 h-full bg-[#f0f9ff] relative items-center justify-center p-12 overflow-hidden">
<!-- Abstract Shapes Composition -->
<div class="absolute inset-0 w-full h-full">
<div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-[#e0f2fe] rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-pulse"></div>
<div class="absolute top-[20%] right-[-10%] w-[50%] h-[50%] bg-[#bae6fd] rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
<div class="absolute bottom-[-10%] left-[20%] w-[40%] h-[40%] bg-[#7dd3fc] rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
</div>
<div class="relative z-10 max-w-lg w-full">
<div class="w-full aspect-square bg-white/40 backdrop-blur-md rounded-2xl border border-white/50 shadow-sm flex items-center justify-center overflow-hidden" data-alt="Abstract minimal geometric composition with blue circles and soft lines representing connection and code structure">
<!-- Abstract CSS Art representing structure/code -->
<div class="relative w-full h-full p-16 flex flex-col justify-between">
<!-- Floating Lines -->
<div class="w-3/4 h-2 bg-primary/10 rounded-full mb-4"></div>
<div class="w-1/2 h-2 bg-primary/20 rounded-full mb-4 ml-8"></div>
<div class="w-2/3 h-2 bg-primary/10 rounded-full mb-12"></div>
<div class="flex gap-4 items-end justify-center h-48">
<div class="w-16 h-32 bg-gradient-to-t from-primary/30 to-primary/5 rounded-t-xl"></div>
<div class="w-16 h-48 bg-gradient-to-t from-primary/40 to-primary/10 rounded-t-xl"></div>
<div class="w-16 h-24 bg-gradient-to-t from-primary/20 to-primary/5 rounded-t-xl"></div>
</div>
</div>
</div>
<div class="mt-8 text-center md:text-left">
<h2 class="text-2xl font-semibold text-[#0c4a6e] mb-2">Master your craft.</h2>
<p class="text-[#0ea5e9] opacity-80 max-w-sm">Join a community of developers building the future, one commit at a time.</p>
</div>
</div>
<!-- Brand Mark Top Left -->
<div class="absolute top-8 left-8 flex items-center gap-2">
<div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white font-bold">L</div>
<span class="font-bold text-lg tracking-tight text-[#0c4a6e]">LearnInk</span>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 h-full flex flex-col justify-center items-center p-6 sm:p-12 relative bg-white">
<!-- Mobile Brand Mark -->
<div class="md:hidden absolute top-6 left-6 flex items-center gap-2">
<div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white font-bold">L</div>
<span class="font-bold text-lg tracking-tight">LearnInk</span>
</div>
<div class="w-full max-w-[420px] flex flex-col gap-6 animate-fade-in-up">
<!-- Header -->
<div class="space-y-1 text-center md:text-left">
<h1 class="text-3xl font-bold tracking-tight text-text-main">Welcome back, Abelion.</h1>
<p class="text-text-muted text-sm font-medium">Ready to continue?</p>
</div>
<!-- Social Auth -->
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 px-4 py-2.5 border border-border-light rounded-xl hover:bg-surface-light hover:border-primary/30 transition-all duration-200 group bg-white">
<svg class="w-5 h-5 text-text-main group-hover:text-primary transition-colors" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405 1.02 0 2.04.135 3 .405 2.28-1.56 3.285-1.23 3.285-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.31 24 12c0-6.63-5.37-12-12-12z"></path>
</svg>
<span class="text-sm font-semibold text-text-main">GitHub</span>
</button>
<button class="flex items-center justify-center gap-2 px-4 py-2.5 border border-border-light rounded-xl hover:bg-surface-light hover:border-primary/30 transition-all duration-200 group bg-white">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-semibold text-text-main">Google</span>
</button>
</div>
<!-- Divider -->
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-border-light"></div>
<span class="flex-shrink-0 mx-4 text-xs font-medium text-text-muted uppercase tracking-widest">Or continue with</span>
<div class="flex-grow border-t border-border-light"></div>
</div>
<!-- Email/Pass Form -->
<form class="flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-text-main ml-1" for="email">Email Address</label>
<input class="w-full rounded-xl border-border-light bg-white px-4 py-3 text-sm placeholder:text-text-muted focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" id="email" placeholder="name@example.com" type="email"/>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1">
<label class="text-sm font-semibold text-text-main" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary-hover hover:underline transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full rounded-xl border-border-light bg-white px-4 py-3 text-sm placeholder:text-text-muted focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm pr-10" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-main transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<button class="mt-4 w-full bg-primary hover:bg-primary-hover text-white font-semibold rounded-xl py-3.5 shadow-sm shadow-blue-200 hover:shadow-md transition-all active:scale-[0.99] flex items-center justify-center gap-2 group" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<p class="text-center text-sm text-text-muted mt-4">
                Don't have an account? 
                <a class="font-bold text-primary hover:underline hover:text-primary-hover transition-colors" href="#">Sign up</a>
</p>
</div>
<!-- Footer / Legal -->
<div class="absolute bottom-6 w-full text-center">
<p class="text-xs text-slate-400">© 2024 LearnInk Inc.</p>
</div>
</div>
</body></html>
