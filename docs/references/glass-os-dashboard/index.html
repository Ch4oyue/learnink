<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glass OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        overflow-x: hidden;
        color: rgba(255, 255, 255, 0.9);
      }
      
      /* Global Noise Texture for tactile feel */
      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 9999;
      }

      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* --- LIQUID GLASS CORE --- */
      
      .glass-panel {
        /* Base Glass */
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.01));
        backdrop-filter: blur(24px) saturate(140%);
        -webkit-backdrop-filter: blur(24px) saturate(140%);
        
        /* The "Thickness" and "Edge" Effect */
        border-top: 1px solid rgba(255, 255, 255, 0.35);
        border-left: 1px solid rgba(255, 255, 255, 0.2);
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        
        /* 3D Shadows: Drop shadow + Inset lighting */
        box-shadow: 
          0 15px 40px -10px rgba(0, 0, 0, 0.4), /* Deep Drop Shadow */
          inset 0 1px 0 0 rgba(255, 255, 255, 0.2), /* Top Inner Highlight */
          inset 0 -1px 0 0 rgba(0, 0, 0, 0.2); /* Bottom Inner Shadow */
          
        border-radius: 24px;
        position: relative;
        overflow: hidden;
      }

      /* Noise overlay inside cards */
      .glass-noise::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
        opacity: 0.03;
        mix-blend-mode: overlay;
        pointer-events: none;
        z-index: 0;
      }
      
      /* --- 3D INTERACTIVE ELEMENTS --- */
      
      .glass-button {
        position: relative;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
        backdrop-filter: blur(10px);
        border-radius: 9999px; /* Pill shape */
        
        /* 3D Bevel Borders */
        border-top: 1px solid rgba(255, 255, 255, 0.4);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        border-left: 1px solid rgba(255, 255, 255, 0.2);
        border-right: 1px solid rgba(255, 255, 255, 0.2);
        
        box-shadow: 
          0 4px 15px rgba(0,0,0,0.1),
          inset 0 1px 0 rgba(255,255,255,0.2);
          
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        overflow: hidden;
      }
      
      /* Shine effect on hover */
      .glass-button::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(rgba(255,255,255,0.2), transparent);
        opacity: 0;
        transition: opacity 0.3s;
      }
      
      .glass-button:hover {
        transform: translateY(-2px);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.08) 100%);
        box-shadow: 
          0 8px 25px rgba(0,0,0,0.2),
          inset 0 1px 0 rgba(255,255,255,0.4);
        border-top: 1px solid rgba(255, 255, 255, 0.6);
      }
      
      .glass-button:active {
        transform: translateY(1px) scale(0.98);
        background: rgba(0,0,0,0.1);
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
      }
      
      /* --- RECESSED INPUTS --- */
      
      .glass-input {
        background: rgba(0, 0, 0, 0.25);
        border-radius: 9999px;
        border: 1px solid transparent;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        border-top: 1px solid rgba(0, 0, 0, 0.3);
        
        /* Inner shadow for "carved" look */
        box-shadow: 
          inset 0 2px 4px rgba(0,0,0,0.3),
          0 1px 0 rgba(255,255,255,0.1); /* Bottom highlight lip */
          
        color: white;
        transition: all 0.3s ease;
      }
      
      .glass-input:focus {
        background: rgba(0, 0, 0, 0.4);
        border-top: 1px solid rgba(0, 0, 0, 0.5);
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 
          inset 0 2px 10px rgba(0,0,0,0.5),
          0 0 0 2px rgba(255,255,255,0.1);
        outline: none;
      }

      /* --- ANIMATIONS --- */

      @keyframes float {
        0%, 100% { transform: translate(0px, 0px); }
        33% { transform: translate(20px, -30px); }
        66% { transform: translate(-15px, 15px); }
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      .animate-shimmer {
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
        background-size: 200% 100%;
        animation: shimmer 2s infinite linear;
      }
      
      @keyframes zoomIn {
        0% { opacity: 0; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes scaleUp {
        0% { opacity: 0; transform: scale(0.8) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes slideUp {
        from { transform: translate(-50%, 100%); opacity: 0; }
        to { transform: translate(-50%, 0); opacity: 1; }
      }

      @keyframes slideIn {
        from { transform: translateY(-10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      .animate-float {
        animation: float 14s infinite ease-in-out;
      }
      .animate-float-delayed {
        animation: float 18s infinite ease-in-out reverse;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",

</script>

</head>

</html>
