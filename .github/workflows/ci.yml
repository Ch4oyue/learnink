name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint Check
        run: bun run lint:check

      - name: Build Check
        run: bun run build

      - name: Test
        run: bun run test

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # gitleaks-action resolves the commit range for the current event via
          # the Action context and the GitHub API, which needs real history.
          fetch-depth: 0

      - name: Scan for committed credentials
        # Scans only the commits introduced by this push or pull request, so the
        # keys already in this repo's history (see docs/SECURITY.md §6) do not
        # fail every run. A GITLEAKS_LICENSE is required for org-owned repos
        # only; this repository is a personal account, so none is needed.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deno-check:
    name: Edge Function Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned so a new Deno release cannot turn this gate red on its own.
          deno-version: v2.9.8

      - name: Type-check Edge Functions
        # `bun run build` does not type-check supabase/functions (they are not in
        # the Vite graph), so a type error there used to surface only at deploy.
        #
        # Five functions carry pre-existing errors that all trace back to the
        # same two root causes: src/integrations/supabase/types.ts is out of date
        # (no system_settings / label_configs / security_logs rows) and several
        # functions type their client parameter as `ReturnType<typeof createClient>`.
        # See docs/SECURITY.md §3 (M6). Until those are fixed, this job pins the
        # exact error count per function and fails if any count grows, so no new
        # type error can reach main. When a fix lands, lower or delete its entry.
        run: |
          set -uo pipefail

          BASELINE="award-xp=3 generate-module=2 generate-quiz=2 get-users=1 ingest-content=17"

          # One "[ERROR]" line per type error. The trailing
          # "error: Type checking failed." summary is not counted.
          count_errors() {
            deno check "$1" 2>&1 | grep -c '\[ERROR\]' || true
          }

          baseline_for() {
            for entry in $BASELINE; do
              if [ "${entry%%=*}" = "$1" ]; then
                echo "${entry##*=}"
                return
              fi
            done
            echo 0
          }

          failed=0

          # Shared modules are imported by every function, so they must be clean.
          for file in supabase/functions/_shared/*.ts; do
            errors=$(count_errors "$file")
            if [ "$errors" -eq 0 ]; then
              echo "ok      $file"
            else
              echo "::error file=$file::$errors type error(s)"
              failed=1
            fi
          done

          # One directory per function. A new function has no baseline entry, so
          # it must type-check clean before it can merge.
          for dir in supabase/functions/*/; do
            entrypoint="${dir}index.ts"
            [ -f "$entrypoint" ] || continue
            name=$(basename "$dir")

            output=$(deno check "$entrypoint" 2>&1) && status=0 || status=$?
            errors=$(printf '%s\n' "$output" | grep -c '\[ERROR\]' || true)
            allowed=$(baseline_for "$name")

            if [ "$errors" -gt "$allowed" ]; then
              echo "::error file=$entrypoint::$errors type error(s), baseline $allowed"
              printf '%s\n' "$output" | grep -A 3 '\[ERROR\]' | head -40
              failed=1
            elif [ "$errors" -lt "$allowed" ]; then
              echo "note    $name improved: $errors < $allowed, lower its baseline"
            elif [ "$status" -ne 0 ] && [ "$errors" -eq 0 ]; then
              echo "::error file=$entrypoint::deno check failed without reporting type errors"
              printf '%s\n' "$output" | tail -20
              failed=1
            else
              echo "ok      $name ($errors known)"
            fi
          done

          exit $failed
